services:
  freshrss:
    image: freshrss/freshrss:1.30.1
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "${FRESHRSS_PORT:-8080}:80"
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
      - ./xExtension-AiAssistant:/var/www/FreshRSS/extensions/xExtension-AiAssistant:ro
    environment:
      TZ: America/New_York
      CRON_MIN: "*/15"
      FRESHRSS_ENV: production
      FRESHRSS_DB_TYPE: pgsql
      FRESHRSS_DB_HOST: postgres
      FRESHRSS_DB_PORT: 5432
      FRESHRSS_DB_BASE: ${POSTGRES_DB:-freshrss}
      FRESHRSS_DB_USER: ${POSTGRES_USER:-freshrss}
      FRESHRSS_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # The AI Assistant extension proxies AI actions to the assistant service
      ASSISTANT_URL: http://assistant:8000
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_INTERNAL_TOKEN:-}
      ASSISTANT_PUBLIC_URL: ${ASSISTANT_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - newsletter

  # The official image with older Postgres binaries added: on start it runs
  # pg_upgrade --link in place when the data is from an older major, so a
  # major bump is a tag change. It deletes the old cluster; dump first.
  postgres:
    image: pgautoupgrade/pgautoupgrade:18-alpine
    container_name: freshrss-db
    restart: unless-stopped
    volumes:
      # 18+ keeps data in /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freshrss}
      POSTGRES_USER: ${POSTGRES_USER:-freshrss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freshrss}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Room for an upgrade before failures count.
      start_period: 2m
    networks:
      - newsletter

  # Built on GitHub; build-publish.yml pins the tag on each push to main.
  youtube-helper:
    image: ghcr.io/kautiontape/freshrss-youtube-helper:sha-8a0c8a0d4e91f25dc51db8a9e496be8fac62d65c
    container_name: youtube-helper
    restart: unless-stopped
    networks:
      - newsletter

  # AI assistant: scoring worker, briefs, chat UI. Talks to Postgres directly.
  assistant:
    image: ghcr.io/kautiontape/freshrss-assistant:sha-8a0c8a0d4e91f25dc51db8a9e496be8fac62d65c
    container_name: assistant
    restart: unless-stopped
    # Komodo points this at the host's /opt/freshrss/.env; local runs use ./.env.
    env_file: ${FRESHRSS_ENV_FILE:-.env}
    environment:
      TZ: America/New_York
      FRESHRSS_DB_HOST: postgres
      FRESHRSS_DB_PORT: 5432
      FRESHRSS_USER: ${FRESHRSS_API_USER:-shawn}
      FRESHRSS_PUBLIC_URL: ${FRESHRSS_PUBLIC_URL:-http://freshrss.yuffie.ts.net:8080}
      YOUTUBE_HELPER_URL: http://youtube-helper:8000
    ports:
      - "${ASSISTANT_PORT:-8081}:8000"
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      youtube-helper:
        condition: service_started
    networks:
      - newsletter

volumes:
  freshrss_data:
  freshrss_extensions:
  postgres_data:

networks:
  newsletter:
    driver: bridge
